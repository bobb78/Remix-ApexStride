name: Build & Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Environment & Keystore
        run: |
          if [ -f ".env.example" ]; then
            cp .env.example .env
          else
            touch .env
          fi
          touch .env.example
          
          # Decode keystore if base64 file exists, or generate fallback with keytool
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          
          if [ ! -f "debug.keystore" ] || [ ! -s "debug.keystore" ]; then
            echo "Generating valid debug.keystore via keytool..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found, generating wrapper..."
            gradle wrapper --gradle-version 9.3.1 || true
          fi
          chmod +x gradlew || true

      - name: Build Android APK
        run: |
          ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Find and Prepare APK
        id: apk_finder
        run: |
          mkdir -p release_apks
          find app/build/outputs/apk -name "*.apk" -exec cp {} release_apks/ \;
          echo "Found APK files:"
          ls -lh release_apks/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: release_apks/*.apk
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: release_apks/*.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.0.0' }}
          name: "Apex Stride APK Release v2.0.0"
          prerelease: false
          body: |
            ## 🏃‍♂️ Apex Stride APK Release v2.0.0
            
            Pembaruan besar Apex Stride v2.0.0 dengan fitur performa & UI baru:
            - **Mode Latihan Track 100M**: Pengukur putaran presisi tinggi dengan target putaran dinamis, ring speedometer stadion, dan sensor GPS akurat.
            - **Grafik Progresi Pace Interaktif (Recharts Style)**: Kurva tren kecepatan lari halus dengan area gradien, sumbu kisi, dan touch scrubbing tooltip.
            - **Sinkronisasi Cloud Firestore**: Tarik dan sinkronkan riwayat lari antar perangkat secara otomatis maupun manual.
            - **Modern Athletic Dark UI**: Desain antarmuka baru yang lebih bersih, kontras tinggi, non-AI generic aesthetic, dan responsif.
            - **Peta Rute & Heatmap 3D**: Visualisasi lintasan lari elevasi dan zona kecepatan.
            
            Unduh file `.apk` di bawah dan pasang langsung di perangkat Android Anda.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
